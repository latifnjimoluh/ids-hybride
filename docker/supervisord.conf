[supervisord]
nodaemon=true
user=root
logfile=/opt/ids-hybride/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# Moteur de détection Snort (capture + écriture de alert_json)
[program:snort3]
command=/usr/local/bin/snort -c /opt/ids-hybride/config/snort.lua -i %(ENV_SNORT_INTERFACE)s -l /opt/ids-hybride/logs -A alert_json -s 65535 -k none -q
autostart=true
autorestart=true
stdout_logfile=/opt/ids-hybride/logs/snort3.log
stderr_logfile=/opt/ids-hybride/logs/snort3.log
stopasgroup=true
killasgroup=true

# Dashboard : backend FastAPI qui sert aussi l'UI
[program:dashboard]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/opt/ids-hybride/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
